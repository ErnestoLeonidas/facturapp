  <link rel="stylesheet" href="assets/css/app.css">

<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <strong>FactuFlow 🐱</strong>
        <small class="text-muted d-block">🐾(modo michi activado)🐾</small>
      </div>
      <nav class="nav flex-column mt-3" id="main-nav">
        <a class="nav-link" href="#/dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a class="nav-link" href="#/solicitudes"><i class="bi bi-file-earmark-text"></i> Solicitudes</a>
        <a class="nav-link" href="#/calendario"><i class="bi bi-calendar3"></i> Calendario</a>
        <a class="nav-link" href="#/clientes"><i class="bi bi-building"></i> Clientes</a>

        <a class="nav-link" href="#/desarrolladores"><i class="bi bi-people"></i> Desarrolladores</a>
        <a class="nav-link" href="#/reportes"><i class="bi bi-bar-chart"></i> Reportes</a>
        <a class="nav-link" href="#/configuracion"><i class="bi bi-gear"></i> Configuración</a>
      </nav>
    </aside>

    <main class="content">
      <header class="topbar d-flex justify-content-between align-items-center mb-3">
        <div id="page-title"><h2 class="mb-0">Cargando…</h2></div>
        <div>
          <a class="btn btn-primary" href="#/solicitudes/nueva"><i class="bi bi-plus-lg"></i> Nueva solicitud</a>
        </div>
      </header>

      <section id="view-root">
        <div class="placeholder-glow">
          <span class="placeholder col-6"></span>
        </div>
      </section>
    </main>
  </div>

    <div class="alert alert-info">Vista <strong data-name></strong> aún no implementada (Fase 1).</div>
  </script>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
